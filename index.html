<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Questionnaire</title>
    <style>
        /* Basic Reset and Layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Form Container Styles */
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Form Group Styles */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        /* Input and Select Styles */
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-family: inherit;
        }

        /* Inline Radio/Checkbox Styles */
        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            align-items: center;
            padding-top: 5px;
        }

        .radio-group label, .checkbox-group label {
            font-weight: normal;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Submit Button Style */
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #ff69b4; /* Hot Pink */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #ff1493; /* Deep Pink */
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Beauty Questionnaire</h2>
        
        <!-- form action and method define where and how data is sent -->
        <form action="#" method="post">
            
            <!-- Contact Info Section -->
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required placeholder="Jane Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="jane@example.com">
            </div>

            <!-- Skin Type Select -->
            <div class="form-group">
                <label for="skin-type">What is your skin type?</label>
                <select id="skin-type" name="skin_type" required>
                    <option value="" disabled selected>Select your skin type</option>
                    <option value="oily">Oily</option>
                    <option value="dry">Dry</option>
                    <option value="combination">Combination</option>
                    <option value="normal">Normal</option>
                    <option value="sensitive">Sensitive</option>
                </select>
            </div>

            <!-- Concerns Radio Buttons -->
            <div class="form-group">
                <label>Primary Skin Concern:</label>
                <div class="radio-group">
                    <label><input type="radio" name="concern" value="acne" required> Acne</label>
                    <label><input type="radio" name="concern" value="aging"> Anti-aging</label>
                    <label><input type="radio" name="concern" value="dryness"> Dryness</label>
                </div>
            </div>

            <!-- Intersts Checkboxes -->
            <div class="form-group">
                <label>Interests (select all that apply):</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="interest" value="skincare"> Skincare</label>
                    <label><input type="checkbox" name="interest" value="makeup"> Makeup</label>
                    <label><input type="checkbox" name="interest" value="haircare"> Haircare</label>
                </div>
            </div>

            <!-- Routine Textarea -->
            <div class="form-group">
                <label for="routine">Describe your current daily routine:</label>
                <textarea id="routine" name="routine" rows="4" placeholder="Mention cleansers, moisturizers, etc..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Questionnaire Request</button>

        </form>
    </div>

</body>
</html>
